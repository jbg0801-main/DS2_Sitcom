[sitcom]
enabled=true
log=true
; Extra PlaceName diagnostics (MapName field spam). Leave false for normal play.
trace_area_title=false
; TRACE FeSceneBossHpGuage fields (correlate with battle_id). Leave false for normal play.
trace_boss_bar=true
poll_hz=20
; Multiplier on top of the in-game Sound Effect slider (0.0–1.0).
; Final loudness ≈ volume × (SFX_slider / 10).
volume=0.7

[events]
laugh_on_hit=true
laugh_on_death=true
cheer_on_boss_bar=true
applause_on_boss_death=true
wipe_on_area_title=true
ooh_on_item_get=true
; Fail laughs (CurrentAnim). Turn off individually if noisy.
laugh_on_empty_flask=true
laugh_on_locked_door=true
laugh_on_no_spell=true
laugh_on_ladder_fall=true

[cooldowns]
laugh_hit_seconds=1.5
ooh_cooldown_seconds=0.75

[paths]
sounds_dir=sounds

[chainload]
; Other dinput8 mods: rename their dinput8.dll (e.g. to bbj.dll) and list them here
; comma-separated, relative to the game folder next to this dinput8.dll.
; Every listed DLL is LoadLibrary'd (DllMain runs). DirectInput8Create is forwarded
; to the first one that exports it; otherwise the system dinput8 is used.
; You can also list one DLL per line in sitcom/chainload.txt
dlls=
