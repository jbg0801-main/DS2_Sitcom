[sitcom]
enabled=true
log=true
poll_hz=20
; Multiplier on top of the in-game Sound Effect slider (0.0–1.0).
; Final loudness ≈ volume × (SFX_slider / 10).
volume=0.7

[events]
laugh_on_hit=true
laugh_on_death=true
cheer_on_boss_bar=true
applause_on_boss_death=true
wipe_on_area_title=true
boo_on_sif_kill=true
ooh_on_item_get=true
trombone_on_pinwheel_death=true
boc_death_on_bed_of_chaos=true
bonk_on_smough_hit=true
; Fail laughs (StayAnim ESD / CurrentAnim). Turn off individually if noisy.
laugh_on_empty_flask=true
laugh_on_locked_door=true
laugh_on_no_spell=true
laugh_on_ladder_fall=true

[cooldowns]
laugh_hit_seconds=1.5
ooh_cooldown_seconds=0.75
; During O&S, hits dealing at least this fraction of max HP play bonk (Smough heuristic).
bonk_min_damage_frac=0.18

[paths]
sounds_dir=sounds
